name: Folia native iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/folia-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/folia-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check the lyric timeline and Xcode project references
        run: bash ios/Checks/run.sh
      - name: Compile for iOS Simulator
        run: >-
          xcodebuild -project ios/Folia.xcodeproj -scheme Folia
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/FoliaSimulator" CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone app
        run: >-
          xcodebuild -project ios/Folia.xcodeproj -scheme Folia
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/FoliaDevice" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/FoliaPackage/Payload"
          cp -R "$RUNNER_TEMP/FoliaDevice/Build/Products/Release-iphoneos/Folia.app" "$RUNNER_TEMP/FoliaPackage/Payload/"
          cd "$RUNNER_TEMP/FoliaPackage"
          /usr/bin/zip -qry Folia-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Folia-iOS-unsigned
          path: ${{ runner.temp }}/FoliaPackage/Folia-iOS-unsigned.ipa
          if-no-files-found: error
