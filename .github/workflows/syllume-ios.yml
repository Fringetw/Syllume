name: Syllume native iOS

on:
  workflow_dispatch:
    inputs:
      require_google_login:
        description: Require the maintainer Google login configuration
        type: boolean
        default: false
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/syllume-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/syllume-ios.yml'

permissions:
  contents: read

jobs:
  build:
    # Same-repository branches are already checked on push; keep PR checks for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Configure maintainer Google login
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_BUNDLE_ID: ${{ vars.GOOGLE_IOS_BUNDLE_ID }}
          FOLIA_BUILD_BUNDLE_ID: ${{ vars.FOLIA_BUILD_BUNDLE_ID }}
          REQUIRE_GOOGLE_LOGIN: ${{ inputs.require_google_login || false }}
        run: |
          if [ "$REQUIRE_GOOGLE_LOGIN" = "true" ]; then
            python3 ios/Tools/configure_google_oauth.py --require-configured
          else
            python3 ios/Tools/configure_google_oauth.py
          fi
      - name: Check the lyric timeline and Xcode project references
        env:
          FOLIA_PROBE_SUBTITLE_SOURCES: "1"
          FOLIA_DIAGNOSTICS_FIXTURE_REPORT: ${{ runner.temp }}/Syllume-diagnostics-fixture.json
        run: |
          set -o pipefail
          bash ios/Checks/run.sh | tee "$RUNNER_TEMP/Syllume-subtitle-source-checks.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-subtitle-source-checks
          path: ${{ runner.temp }}/Syllume-subtitle-source-checks.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Syllume-diagnostics-fixture
          path: ${{ runner.temp }}/Syllume-diagnostics-fixture.json
          if-no-files-found: error
      - name: Compile for iOS Simulator
        run: >-
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone app
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: >-
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/SyllumeDevice" CODE_SIGNING_ALLOWED=NO build
      # Make the successfully compiled device build available while simulator checks run.
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumePackage/Payload"
          cp -R "$RUNNER_TEMP/SyllumeDevice/Build/Products/Release-iphoneos/Syllume.app" "$RUNNER_TEMP/SyllumePackage/Payload/"
          cd "$RUNNER_TEMP/SyllumePackage"
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Syllume.app/Info.plist)
          /usr/bin/zip -qry "Syllume-iOS-${version}-unsigned.ipa" Payload
          python3 -c 'import json,plistlib; i=plistlib.load(open("Payload/Syllume.app/Info.plist","rb")); print(json.dumps({"google_configured":bool(i.get("FoliaGoogleClientID")) and bool(i.get("FoliaGoogleBundleID")),"version":i["CFBundleShortVersionString"],"build_bundle_id":i["CFBundleIdentifier"],"google_registered_bundle_id":i.get("FoliaGoogleBundleID", ""),"unsigned_bundle_matches_google":i["CFBundleIdentifier"]==i.get("FoliaGoogleBundleID")}))' > google-login-build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: Syllume-iOS-unsigned
          path: |
            ${{ runner.temp }}/SyllumePackage/Syllume-iOS-*-unsigned.ipa
            ${{ runner.temp }}/SyllumePackage/google-login-build-info.json
          if-no-files-found: error
      - name: Exercise YouTube playlist selection and audio playback on iPhone Simulator
        timeout-minutes: 25
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "FOLIA_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          run_playlist_ui() {
            xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
              -resultBundlePath "$RUNNER_TEMP/$1.xcresult" \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeCoverFallbackAndOfflineCacheWhenAudioUnavailable \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistChoicePersists \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistDownloadRequiresConfirmation \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeSyncedAudioPausesWithoutVideo \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeSongAutomaticallyPlaysVisibleOriginal \
              -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
          }
          set -o pipefail
          playlist_log="$RUNNER_TEMP/SyllumePlaylistUI.log"
          if ! run_playlist_ui SyllumePlaylistUI 2>&1 | tee "$playlist_log"; then
            if grep -Eq 'Timed out waiting for AX loaded notification|Timed out while loading Accessibility' "$playlist_log" && ! grep -q 'Test Case .* failed (' "$playlist_log"; then
              echo "::warning::Simulator accessibility initialization failed. Retrying the same tests once."
              xcrun simctl bootstatus "$simulator_id" -b
              run_playlist_ui SyllumePlaylistUIRetry
            else
              exit 1
            fi
          fi
      - name: Exercise recorded-song playback, artwork and lyric clocks on iPhone Simulator
        if: ${{ !cancelled() && env.FOLIA_SIMULATOR_ID != '' }}
        timeout-minutes: 12
        run: |
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$FOLIA_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
            -resultBundlePath "$RUNNER_TEMP/SyllumeRecordedSongsUI.xcresult" \
            -only-testing:SyllumeUITests/SyllumeUITests/testRecordedSongsUseVisibleFallbackWithSharedArtworkAndTimedLyrics \
            -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
      - name: Exercise playback, diagnostics and platform setup on iPhone Simulator
        if: ${{ !cancelled() && env.FOLIA_SIMULATOR_ID != '' }}
        timeout-minutes: 32
        run: |
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$FOLIA_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
            -resultBundlePath "$RUNNER_TEMP/SyllumeUI.xcresult" \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeCoverFallbackAndOfflineCacheWhenAudioUnavailable \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistChoicePersists \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistDownloadRequiresConfirmation \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeSyncedAudioPausesWithoutVideo \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeSongAutomaticallyPlaysVisibleOriginal \
            -skip-testing:SyllumeUITests/SyllumeUITests/testRecordedSongsUseVisibleFallbackWithSharedArtworkAndTimedLyrics \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativeLoopbackStreamsAndSeeks \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativeLoopbackFallsBackAfterTimeout \
            -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
      - name: Export simulator test summaries, screenshots and diagnostic reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumeUIScreenshots"
          for result in SyllumePlaylistUI SyllumePlaylistUIRetry SyllumeRecordedSongsUI SyllumeUI; do
            if [ -d "$RUNNER_TEMP/$result.xcresult" ]; then
              if summary=$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$result.xcresult"); then
                printf '%s\n' "$summary" > "$RUNNER_TEMP/SyllumeUIScreenshots/$result-summary.json"
              else
                echo "::warning::Could not export the test summary from $result"
              fi
              if ! xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$result.xcresult" \
                --output-path "$RUNNER_TEMP/SyllumeUIScreenshots/$result"; then
                echo "::warning::Could not export attachments from $result"
              fi
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-iOS-UI-checks
          path: ${{ runner.temp }}/SyllumeUIScreenshots
          if-no-files-found: ignore

  ios-26-player:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lyric font
        run: python3 ios/Tools/prepare_lyric_font.py
      - name: Build the iOS 26 simulator tests
        run: |
          xcodebuild -version
          # The loopback fixture is used only by this Debug simulator build. The device IPA uses the repository plist.
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' ios/Syllume/Resources/Info.plist
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key, group in d["devices"].items() if "iOS-26" in key for x in group if x["name"].startswith("iPhone")))')
          echo "FOLIA_IOS26_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeIOS26Build" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Exercise progress, Mist and large text on iOS 26
        run: |
          simulator_id="$FOLIA_IOS26_SIMULATOR_ID"
          derived_data="$RUNNER_TEMP/SyllumeIOS26Build"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$derived_data/Build/Products/Debug-iphonesimulator/Syllume.app/Info.plist")
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          run_player_check() {
            local result_name="$1" test_name="$2"
            # Let CoreSimulator stop the previous app before starting a separate XCTest session.
            xcrun simctl terminate "$simulator_id" "$bundle_id" 2>/dev/null || true
            xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath "$derived_data" \
              -resultBundlePath "$RUNNER_TEMP/$result_name.xcresult" \
              -only-testing:"SyllumeUITests/SyllumeUITests/$test_name" \
              -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building
          }
          failed=0
          run_player_check SyllumeIOS26LargeText testLargeTextPlaybackKeepsStyleMenuAndControlsUsable || failed=1
          run_player_check SyllumeIOS26Resources testMistRenderingResourceSample || failed=1
          run_player_check SyllumeIOS26Scrub testMistStylePersistsAndProgressControlsSeekPausedAudio || failed=1
          run_http_check() (
            name="$1"; test_name="$2"; mode="$3"
            fixture="$RUNNER_TEMP/$name"
            mkdir -p "$fixture" || exit 1
            if [ "$mode" = stalled ]; then touch "$fixture/stalled" || exit 1; fi
            python3 ios/Checks/range_audio_server.py --media ios/Syllume/Resources/tide.m4a \
              --ready-file "$fixture/ready.json" --log "$fixture/http.jsonl" \
              --stall-file "$fixture/stalled" --bytes-per-second 65536 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for ((attempt=0; attempt<150; attempt++)); do
              [ ! -f "$fixture/ready.json" ] || break
              sleep 0.1
            done
            endpoint=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$fixture/ready.json") || exit 1
            export TEST_RUNNER_SYLLUME_TEST_RANGE_AUDIO_URL="$endpoint"
            status=0
            run_player_check "$name" "$test_name" || status=1
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" || status=1
            trap - EXIT
            python3 - "$fixture/http.jsonl" "$mode" <<'PY' || status=1
          import json, sys
          with open(sys.argv[1]) as logfile:
              records = [json.loads(line) for line in logfile]
          requests = {r['id']: r for r in records if r['event'] == 'request' and r['method'] == 'GET'}
          transferred = sum(r['bodyBytes'] for r in records if r['event'] == 'response' and r['id'] in requests)
          print(f"Loopback {sys.argv[2]}: GETs={len(requests)}, media body bytes={transferred}")
          assert requests, "The simulator must reach the HTTP audio fixture"
          if sys.argv[2] == 'stalled':
              assert transferred == 0, "The blocked stream must send no media body"
          else:
              assert transferred > 0 and any(r['status'] == 206 for r in requests.values()), "Expected HTTP range playback"
          PY
            exit "$status"
          )
          run_http_check SyllumeIOS26HTTP testNativeLoopbackStreamsAndSeeks playing || failed=1
          run_http_check SyllumeIOS26HTTPStall testNativeLoopbackFallsBackAfterTimeout stalled || failed=1
          exit "$failed"
      - name: Export iOS 26 test evidence
        if: always()
        run: |
          for name in SyllumeIOS26LargeText SyllumeIOS26Resources SyllumeIOS26Scrub SyllumeIOS26HTTP SyllumeIOS26HTTPStall; do
            result="$RUNNER_TEMP/$name.xcresult"
            if [ -d "$result" ]; then
              evidence="$RUNNER_TEMP/SyllumeIOS26Evidence/$name"
              mkdir -p "$evidence"
              xcrun xcresulttool get test-results summary --path "$result" > "$evidence/test-summary.json"
              xcrun xcresulttool export attachments --path "$result" --output-path "$evidence/attachments"
            fi
            if [ -f "$RUNNER_TEMP/$name/http.jsonl" ]; then
              mkdir -p "$RUNNER_TEMP/SyllumeIOS26Evidence/$name"
              cp "$RUNNER_TEMP/$name/http.jsonl" "$RUNNER_TEMP/SyllumeIOS26Evidence/$name/"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-iOS-26-player
          path: ${{ runner.temp }}/SyllumeIOS26Evidence
          if-no-files-found: ignore
