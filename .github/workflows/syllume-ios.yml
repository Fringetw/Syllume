name: Syllume native iOS

on:
  workflow_dispatch:
    inputs:
      require_google_login:
        description: Require the maintainer Google login configuration
        type: boolean
        default: false
      public_youtube_only:
        description: Run public YouTube IFrame playback on the iOS 26 simulator
        type: boolean
        default: false
      public_native_only:
        description: Run AVPlayer against the public HTTPS sample on the iOS 26 simulator
        type: boolean
        default: false
      youtube_reopen_only:
        description: Exercise reopening the visible YouTube player with local test media
        type: boolean
        default: false
      http_seek_only:
        description: Run the iOS 26 paused HTTP seek recovery case
        type: boolean
        default: false
      http_start_only:
        description: Run iOS 26 HTTP startup with delayed delivery and permanent stalls
        type: boolean
        default: false
      navidrome_only:
        description: Run the production Navidrome client against an isolated HTTPS server
        type: boolean
        default: false
      navidrome_simulator:
        description: Run the Navidrome HTTPS checks and play through that server on the iOS 26 simulator
        type: boolean
        default: false
      startup_only:
        description: Run local audio and animated lyrics startup recovery on the iOS 26 simulator
        type: boolean
        default: false
      intel_recorded_only:
        description: Capture iOS 18 stage initialization while the original player is visible
        type: boolean
        default: false
      ios18_arm64:
        description: Run the iOS 18 suite on an Apple Silicon runner for comparison
        type: boolean
        default: false
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/syllume-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/syllume-ios.yml'

permissions:
  contents: read

jobs:
  build:
    # Same-repository branches are already checked on push; keep PR checks for forks.
    if: ${{ (inputs.intel_recorded_only || (!inputs.public_youtube_only && !inputs.public_native_only && !inputs.youtube_reopen_only && !inputs.http_seek_only && !inputs.http_start_only && !inputs.navidrome_only && !inputs.navidrome_simulator && !inputs.startup_only)) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ inputs.ios18_arm64 && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 105
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Configure maintainer Google login
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_BUNDLE_ID: ${{ vars.GOOGLE_IOS_BUNDLE_ID }}
          FOLIA_BUILD_BUNDLE_ID: ${{ vars.FOLIA_BUILD_BUNDLE_ID }}
          REQUIRE_GOOGLE_LOGIN: ${{ inputs.require_google_login || false }}
        run: |
          if [ "$REQUIRE_GOOGLE_LOGIN" = "true" ]; then
            python3 ios/Tools/configure_google_oauth.py --require-configured
          else
            python3 ios/Tools/configure_google_oauth.py
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the lyric timeline and Xcode project references
        env:
          FOLIA_PROBE_SUBTITLE_SOURCES: "1"
          FOLIA_DIAGNOSTICS_FIXTURE_REPORT: ${{ runner.temp }}/Syllume-diagnostics-fixture.json
        run: |
          set -o pipefail
          bash ios/Checks/run.sh | tee "$RUNNER_TEMP/Syllume-subtitle-source-checks.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-subtitle-source-checks
          path: ${{ runner.temp }}/Syllume-subtitle-source-checks.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Syllume-diagnostics-fixture
          path: ${{ runner.temp }}/Syllume-diagnostics-fixture.json
          if-no-files-found: error
      - name: Test paused handover in the Sonnet and Lumiere runtimes
        run: |
          npm ci --prefix ios/Visualizer --ignore-scripts --no-audit --no-fund
          node --test ios/Visualizer/test/runtimeHandover.integration.mjs
      - name: Compile for iOS Simulator
        run: >-
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned iPhone app
        if: ${{ !inputs.intel_recorded_only }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: >-
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/SyllumeDevice" CODE_SIGNING_ALLOWED=NO build
      # Make the successfully compiled device build available while simulator checks run.
      - name: Package unsigned IPA
        if: ${{ !inputs.intel_recorded_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumePackage/Payload"
          cp -R "$RUNNER_TEMP/SyllumeDevice/Build/Products/Release-iphoneos/Syllume.app" "$RUNNER_TEMP/SyllumePackage/Payload/"
          cd "$RUNNER_TEMP/SyllumePackage"
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Syllume.app/Info.plist)
          /usr/bin/zip -qry "Syllume-iOS-${version}-unsigned.ipa" Payload
          python3 -c 'import json,plistlib; i=plistlib.load(open("Payload/Syllume.app/Info.plist","rb")); print(json.dumps({"google_configured":bool(i.get("FoliaGoogleClientID")) and bool(i.get("FoliaGoogleBundleID")),"version":i["CFBundleShortVersionString"],"build_bundle_id":i["CFBundleIdentifier"],"google_registered_bundle_id":i.get("FoliaGoogleBundleID", ""),"unsigned_bundle_matches_google":i["CFBundleIdentifier"]==i.get("FoliaGoogleBundleID")}))' > google-login-build-info.json
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.intel_recorded_only }}
        with:
          name: Syllume-iOS-unsigned
          path: |
            ${{ runner.temp }}/SyllumePackage/Syllume-iOS-*-unsigned.ipa
            ${{ runner.temp }}/SyllumePackage/google-login-build-info.json
          if-no-files-found: error
      - name: Exercise YouTube playlist selection and audio playback on iPhone Simulator
        timeout-minutes: 32
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtime = json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-18-6", [])
          simulator = next((device for device in runtime if device["name"] == "iPhone 16 Pro"), None)
          if simulator is None:
              sys.exit("This suite requires iPhone 16 Pro on iOS 18.6.")
          print(simulator["udid"])
          ')
          echo "iPhone 16 Pro / iOS 18.6 simulator host architecture: $(uname -m)"
          echo "FOLIA_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          run_playlist_ui() {
            xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
              -resultBundlePath "$RUNNER_TEMP/$1.xcresult" \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeCoverFallbackAndOfflineCacheWhenAudioUnavailable \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistChoicePersists \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistDownloadRequiresConfirmation \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeSyncedAudioPausesWithoutVideo \
              -only-testing:SyllumeUITests/SyllumeUITests/testYouTubeSongAutomaticallyPlaysVisibleOriginal \
              -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
          }
          set -o pipefail
          playlist_log="$RUNNER_TEMP/SyllumePlaylistUI.log"
          if ! run_playlist_ui SyllumePlaylistUI 2>&1 | tee "$playlist_log"; then
            if grep -Eq 'Timed out waiting for AX loaded notification|Timed out while loading Accessibility' "$playlist_log" && ! grep -q 'Test Case .* failed (' "$playlist_log"; then
              echo "::warning::Simulator accessibility initialization failed. Retrying the same tests once."
              xcrun simctl bootstatus "$simulator_id" -b
              run_playlist_ui SyllumePlaylistUIRetry
            else
              exit 1
            fi
          fi
      - name: Export iOS 18 YouTube transport checkpoints
        if: ${{ !cancelled() && !inputs.intel_recorded_only && env.FOLIA_SIMULATOR_ID != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumeUIScreenshots"
          xcrun simctl spawn "$FOLIA_SIMULATOR_ID" log show --last 35m --style compact \
            --predicate 'process == "Syllume" AND eventMessage CONTAINS "[SyllumeYouTube]"' \
            > "$RUNNER_TEMP/SyllumeUIScreenshots/YouTube-iOS18.log" ||
            echo "::warning::Could not export the iOS 18 YouTube transport checkpoints."
      - name: Exercise recorded-song playback, artwork and lyric clocks on iPhone Simulator
        if: ${{ !cancelled() && env.FOLIA_SIMULATOR_ID != '' }}
        timeout-minutes: 12
        run: |
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$FOLIA_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
            -resultBundlePath "$RUNNER_TEMP/SyllumeRecordedSongsUI.xcresult" \
            -only-testing:SyllumeUITests/SyllumeUITests/testRecordedSongsUseVisibleFallbackWithSharedArtworkAndTimedLyrics \
            -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
      - name: Export iOS 18 stage initialization checkpoints
        if: ${{ !cancelled() && env.FOLIA_SIMULATOR_ID != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumeUIScreenshots"
          xcrun simctl spawn "$FOLIA_SIMULATOR_ID" log show --last 25m --style compact \
            --predicate 'process == "Syllume" AND eventMessage CONTAINS "[SyllumeStage]"' \
            > "$RUNNER_TEMP/SyllumeUIScreenshots/Sonnet-recorded.log" ||
            echo "::warning::Could not export the iOS 18 stage checkpoints."
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.intel_recorded_only && env.FOLIA_SIMULATOR_ID != '' }}
        with:
          name: Syllume-iOS18-recorded-stage
          path: ${{ runner.temp }}/SyllumeUIScreenshots/Sonnet-recorded.log
          if-no-files-found: ignore
      - name: Exercise playback, diagnostics and platform setup on iPhone Simulator
        if: ${{ !cancelled() && !inputs.intel_recorded_only && env.FOLIA_SIMULATOR_ID != '' }}
        timeout-minutes: 32
        run: |
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$FOLIA_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
            -resultBundlePath "$RUNNER_TEMP/SyllumeUI.xcresult" \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeCoverFallbackAndOfflineCacheWhenAudioUnavailable \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistChoicePersists \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubePlaylistDownloadRequiresConfirmation \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeSyncedAudioPausesWithoutVideo \
            -skip-testing:SyllumeUITests/SyllumeUITests/testYouTubeSongAutomaticallyPlaysVisibleOriginal \
            -skip-testing:SyllumeUITests/SyllumeUITests/testRecordedSongsUseVisibleFallbackWithSharedArtworkAndTimedLyrics \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativeLoopbackStreamsAndSeeks \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativePublicHTTPSStreamsAndSeeks \
            -skip-testing:SyllumeUITests/SyllumeUITests/testLiveNavidromeResumesAtConfirmedTimeAfterTimeout \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativeLoopbackFallsBackAfterTimeout \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativeLoopbackStartsAfterDelayedInitialRange \
            -skip-testing:SyllumeUITests/SyllumeUITests/testNativePausedSeekEndsWhenHTTPStopsResponding \
            -skip-testing:SyllumeUITests/SyllumeUITests/testCompactYouTubePlayerKeepsVideoAndControlsVisibleWithLargeText \
            -skip-testing:SyllumeUITests/SyllumeUITests/testPublicYouTubeIFrameReferenceVideo \
            -skip-testing:SyllumeUITests/SyllumeUITests/testPublicYouTubeIFrameRecordedHelp \
            -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
      - name: Export iOS 18 playback stage checkpoints
        if: ${{ !cancelled() && !inputs.intel_recorded_only && env.FOLIA_SIMULATOR_ID != '' }}
        run: |
          xcrun simctl spawn "$FOLIA_SIMULATOR_ID" log show --last 40m --style compact \
            --predicate 'process == "Syllume" AND eventMessage CONTAINS "[SyllumeStage]"' \
            > "$RUNNER_TEMP/SyllumeUIScreenshots/Sonnet-iOS18.log" ||
            echo "::warning::Could not export the iOS 18 playback stage checkpoints."
      - name: Verify large text on the iPhone SE YouTube player
        if: ${{ !cancelled() && !inputs.intel_recorded_only && env.FOLIA_SIMULATOR_ID != '' }}
        # The first boot and device-specific asset build share this step with XCTest.
        timeout-minutes: 22
        run: |
          compact_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          groups = json.load(sys.stdin)["devices"].values()
          device = next((d for group in groups if any(d["udid"] == sys.argv[1] for d in group)
                         for d in group if d["name"] == "iPhone SE (3rd generation)"), None)
          if device is None:
              sys.exit("The current iOS runtime needs an iPhone SE (3rd generation) simulator.")
          print(device["udid"])
          ' "$FOLIA_SIMULATOR_ID")
          if [ "$compact_id" != "$FOLIA_SIMULATOR_ID" ]; then
            xcrun simctl shutdown "$FOLIA_SIMULATOR_ID" 2>/dev/null || true
          fi
          xcrun simctl boot "$compact_id" || xcrun simctl list devices booted | grep -F "$compact_id"
          xcrun simctl bootstatus "$compact_id" -b
          run_compact_ui() {
            xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
              -destination "platform=iOS Simulator,id=$compact_id" \
              -derivedDataPath "$RUNNER_TEMP/SyllumeSimulator" \
              -resultBundlePath "$RUNNER_TEMP/$1.xcresult" \
              -only-testing:SyllumeUITests/SyllumeUITests/testCompactYouTubePlayerKeepsVideoAndControlsVisibleWithLargeText \
              -parallel-testing-enabled NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO test
          }
          set -o pipefail
          compact_log="$RUNNER_TEMP/SyllumeCompactYouTube.log"
          if ! run_compact_ui SyllumeCompactYouTube 2>&1 | tee "$compact_log"; then
            if grep -Eq 'Timed out waiting for AX loaded notification|Timed out while loading Accessibility' "$compact_log" && ! grep -q 'Test Case .* started\.' "$compact_log"; then
              echo "::warning::iPhone SE accessibility initialization failed before the test started. Retrying once."
              xcrun simctl bootstatus "$compact_id" -b
              run_compact_ui SyllumeCompactYouTubeRetry
            else
              exit 1
            fi
          fi
      - name: Export simulator test summaries, screenshots and diagnostic reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/SyllumeUIScreenshots"
          for result in SyllumePlaylistUI SyllumePlaylistUIRetry SyllumeRecordedSongsUI SyllumeUI SyllumeCompactYouTube SyllumeCompactYouTubeRetry; do
            if [ -d "$RUNNER_TEMP/$result.xcresult" ]; then
              if summary=$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$result.xcresult"); then
                printf '%s\n' "$summary" > "$RUNNER_TEMP/SyllumeUIScreenshots/$result-summary.json"
              else
                echo "::warning::Could not export the test summary from $result"
              fi
              if ! xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$result.xcresult" \
                --output-path "$RUNNER_TEMP/SyllumeUIScreenshots/$result"; then
                echo "::warning::Could not export attachments from $result"
              fi
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-iOS-UI-checks
          path: ${{ runner.temp }}/SyllumeUIScreenshots
          if-no-files-found: ignore

  navidrome-api:
    if: inputs.navidrome_only || inputs.navidrome_simulator
    runs-on: macos-26
    timeout-minutes: ${{ inputs.navidrome_simulator && 35 || 18 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify authenticated Navidrome lookup, streaming and download
        env:
          SYLLUME_NAVIDROME_SIMULATOR: ${{ inputs.navidrome_simulator && '1' || '0' }}
        run: |
          set -o pipefail
          bash ios/Checks/run_navidrome_live.sh 2>&1 | tee "$RUNNER_TEMP/Syllume-Navidrome-live.txt"
      - name: Verify the retry opens a stream without fetching loaded metadata again
        if: inputs.navidrome_simulator
        run: |
          python3 - "$RUNNER_TEMP/SyllumeNavidromePlayback/simulator-request-counts.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as report:
              counts = json.load(report)
          before, after = counts["beforeRetry"], counts["afterRetry"]
          metadata = ("/rest/getCoverArt", "/rest/getLyricsBySongId", "/rest/getLyrics")
          print(json.dumps(counts, indent=2))
          if (before["/rest/getCoverArt"] < 1 or before["/rest/getLyricsBySongId"] < 1
                  or after["/rest/stream"] < 1 or any(after[path] for path in metadata)
                  or any(counts["unknownPhase"].values())):
              sys.exit("Expected initial cover and lyrics, a new stream on retry, and no repeated metadata.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-Navidrome-live
          path: ${{ runner.temp }}/Syllume-Navidrome-live.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.navidrome_simulator }}
        with:
          name: Syllume-Navidrome-iOS26-recovery
          path: ${{ runner.temp }}/SyllumeNavidromePlayback
          if-no-files-found: error

  ios-26-player:
    if: ${{ !inputs.intel_recorded_only && !inputs.ios18_arm64 && ((!inputs.navidrome_only && !inputs.navidrome_simulator) || inputs.public_youtube_only || inputs.public_native_only || inputs.startup_only) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lyric font
        run: python3 ios/Tools/prepare_lyric_font.py
      - name: Build the iOS 26 simulator tests
        id: build_ios26
        run: |
          xcodebuild -version
          # The loopback fixture is used only by this Debug simulator build. The device IPA uses the repository plist.
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' ios/Syllume/Resources/Info.plist
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key, group in d["devices"].items() if "iOS-26" in key for x in group if x["name"].startswith("iPhone")))')
          echo "FOLIA_IOS26_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeIOS26Build" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Exercise progress, Mist and large text on iOS 26
        if: ${{ inputs.startup_only || (!inputs.public_youtube_only && !inputs.public_native_only) }}
        timeout-minutes: 50
        env:
          STARTUP_ONLY: ${{ inputs.startup_only || false }}
          YOUTUBE_REOPEN_ONLY: ${{ inputs.youtube_reopen_only || false }}
          HTTP_SEEK_ONLY: ${{ inputs.http_seek_only || false }}
          HTTP_START_ONLY: ${{ inputs.http_start_only || false }}
        run: |
          simulator_id="$FOLIA_IOS26_SIMULATOR_ID"
          derived_data="$RUNNER_TEMP/SyllumeIOS26Build"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$derived_data/Build/Products/Debug-iphonesimulator/Syllume.app/Info.plist")
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          run_player_check() {
            local result_name="$1" test_name="$2"
            # Let CoreSimulator stop the previous app before starting a separate XCTest session.
            xcrun simctl terminate "$simulator_id" "$bundle_id" 2>/dev/null || true
            xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath "$derived_data" \
              -resultBundlePath "$RUNNER_TEMP/$result_name.xcresult" \
              -only-testing:"SyllumeUITests/SyllumeUITests/$test_name" \
              -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building
          }
          if [ "$YOUTUBE_REOPEN_ONLY" = "true" ]; then
            run_player_check SyllumeIOS26YouTubeReopen testYouTubeSongAutomaticallyPlaysVisibleOriginal
            exit $?
          fi
          run_http_check() (
            name="$1"; test_name="$2"; mode="$3"
            fixture="$RUNNER_TEMP/$name"
            mkdir -p "$fixture" || exit 1
            rate=0
            if [ "$mode" = paced ]; then rate=65536; fi
            media=ios/Syllume/Resources/tide.m4a
            control=()
            if [ "$mode" = delayed ]; then
              control=(--allow-control --stall-after-byte 2 --resume-after-stall 10)
            fi
            if [ "$mode" = seek ]; then
              media="$fixture/long.wav"
              rate=65536
              control=(--allow-control)
              python3 - "$media" <<'PY' || exit 1
          import math, struct, sys, wave
          sample_rate = 16000
          samples = b''.join(struct.pack('<h', round(5000 * math.sin(2 * math.pi * 220 * n / sample_rate))) for n in range(sample_rate))
          with wave.open(sys.argv[1], 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(sample_rate)
              for _ in range(150):
                  output.writeframesraw(samples)
          PY
            fi
            if [ "$mode" = stalled ]; then touch "$fixture/stalled" || exit 1; fi
            python3 ios/Checks/range_audio_server.py --media "$media" \
              --ready-file "$fixture/ready.json" --log "$fixture/http.jsonl" \
              --stall-file "$fixture/stalled" --bytes-per-second "$rate" "${control[@]}" &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for ((attempt=0; attempt<150; attempt++)); do
              [ ! -f "$fixture/ready.json" ] || break
              sleep 0.1
            done
            endpoint=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$fixture/ready.json") || exit 1
            export TEST_RUNNER_SYLLUME_TEST_RANGE_AUDIO_URL="$endpoint"
            status=0
            run_player_check "$name" "$test_name" || status=1
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" || status=1
            trap - EXIT
            python3 - "$fixture/http.jsonl" "$mode" <<'PY' || status=1
          import json, sys
          with open(sys.argv[1]) as logfile:
              records = [json.loads(line) for line in logfile]
          requests = {r['id']: r for r in records if r['event'] == 'request' and r['method'] == 'GET'}
          transferred = sum(r['bodyBytes'] for r in records if r['event'] == 'response' and r['id'] in requests)
          print(f"Loopback {sys.argv[2]}: GETs={len(requests)}, media body bytes={transferred}")
          assert requests, "The simulator must reach the HTTP audio fixture"
          if sys.argv[2] == 'stalled':
              assert transferred == 0, "The blocked stream must send no media body"
          else:
              assert transferred > 0 and any(r['status'] == 206 for r in requests.values()), "Expected HTTP range playback"
          if sys.argv[2] == 'seek':
              assert [r['action'] for r in records if r['event'] == 'control'] == ['stall', 'resume'], "Expected a controlled seek stall and recovery"
              assert any(r['event'] == 'stall' and r['offset'] > 0 for r in records), "The paused seek must require unavailable bytes"
          if sys.argv[2] == 'delayed':
              resume = [r for r in records if r['event'] == 'timed-resume']
              assert len(resume) == 1 and resume[0]['elapsedMs'] >= 10_000, "Expected a ten second initial range delay"
              assert any(r['event'] == 'stall' and r['offset'] >= 2 for r in records), "Expected the initial media body to block beyond the probe"
          PY
            exit "$status"
          )
          if [ "$HTTP_SEEK_ONLY" = "true" ]; then
            run_http_check SyllumeIOS26HTTPSeek testNativePausedSeekEndsWhenHTTPStopsResponding seek
            exit $?
          fi
          if [ "$HTTP_START_ONLY" = "true" ]; then
            failed=0
            run_http_check SyllumeIOS26HTTPInitialRange testNativeLoopbackStartsAfterDelayedInitialRange delayed || failed=1
            run_http_check SyllumeIOS26HTTPStall testNativeLoopbackFallsBackAfterTimeout stalled || failed=1
            exit "$failed"
          fi
          failed=0
          if [ "$STARTUP_ONLY" = "true" ]; then
            run_player_check SyllumeIOS26ColdSonnet testAnimatedPlayback || failed=1
          else
            run_player_check SyllumeIOS26LargeText testLargeTextPlaybackKeepsStyleMenuAndControlsUsable || failed=1
            run_player_check SyllumeIOS26Resources testMistRenderingResourceSample || failed=1
            run_player_check SyllumeIOS26Scrub testMistStylePersistsAndProgressControlsSeekPausedAudio || failed=1
            run_player_check SyllumeIOS26NativeEnd testNativeDelayedEndDoesNotReplaceSeekAndSeekingToEndRepeats || failed=1
          fi
          run_player_check SyllumeIOS26LocalStartup testNativeLocalStartupRecoversOnce || failed=1
          run_player_check SyllumeIOS26NativeClockStall testNativeFrozenClockStopsPlayingAndCanRetry || failed=1
          run_player_check SyllumeIOS26SonnetRetry testSonnetRetriesRejectedInitialization || failed=1
          run_player_check SyllumeIOS26SonnetTimeout testSonnetTimeoutEndsWithoutStoppingAudio || failed=1
          run_player_check SyllumeIOS26NavigationRetry testLyricStageRetriesSilentNavigationAndKeepsAudioPlaying || failed=1
          run_player_check SyllumeIOS26NavigationLimit testLyricStageStopsAfterSilentNavigationRetry || failed=1
          if [ "$STARTUP_ONLY" = "true" ]; then
            run_player_check SyllumeIOS26LargeText testLargeTextPlaybackKeepsStyleMenuAndControlsUsable || failed=1
            run_player_check SyllumeIOS26RecordedSonnet testRecordedSongsUseVisibleFallbackWithSharedArtworkAndTimedLyrics || failed=1
            exit "$failed"
          fi
          run_http_check SyllumeIOS26HTTP testNativeLoopbackStreamsAndSeeks playing || failed=1
          run_http_check SyllumeIOS26HTTPPaced testNativeLoopbackStreamsAndSeeks paced || failed=1
          run_http_check SyllumeIOS26HTTPStall testNativeLoopbackFallsBackAfterTimeout stalled || failed=1
          run_http_check SyllumeIOS26HTTPInitialRange testNativeLoopbackStartsAfterDelayedInitialRange delayed || failed=1
          run_http_check SyllumeIOS26HTTPSeek testNativePausedSeekEndsWhenHTTPStopsResponding seek || failed=1
          exit "$failed"
      - name: Verify published media through the official YouTube IFrame
        if: inputs.public_youtube_only
        timeout-minutes: 12
        run: |
          simulator_id="$FOLIA_IOS26_SIMULATOR_ID"
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          mkdir -p "$RUNNER_TEMP/SyllumeIOS26Evidence/SyllumePublicYouTube"
          set -o pipefail
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeIOS26Build" \
            -resultBundlePath "$RUNNER_TEMP/SyllumePublicYouTube.xcresult" \
            -only-testing:SyllumeUITests/SyllumeUITests/testPublicYouTubeIFrameReferenceVideo \
            -only-testing:SyllumeUITests/SyllumeUITests/testPublicYouTubeIFrameRecordedHelp \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$RUNNER_TEMP/SyllumeIOS26Evidence/SyllumePublicYouTube/runner.log"
      - name: Verify public HTTPS playback with AVPlayer
        if: ${{ !cancelled() && inputs.public_native_only && steps.build_ios26.conclusion == 'success' }}
        timeout-minutes: 12
        run: |
          set -e -o pipefail
          endpoint='https://raw.githubusercontent.com/Fringetw/Syllume/654a939ed6f75fc7e87cd035cd8796a2bb786984/ios/Syllume/Resources/tide.m4a'
          evidence="$RUNNER_TEMP/SyllumeIOS26Evidence/SyllumePublicNativeHTTPS"
          mkdir -p "$evidence"
          response=$(curl -fsS --proto '=https' --max-time 20 --range 0-15 \
            --dump-header "$evidence/range-headers.txt" --output "$RUNNER_TEMP/tide-range" --write-out '%{http_code}' "$endpoint")
          test "$response" = 206
          test "$(wc -c < "$RUNNER_TEMP/tide-range" | tr -d '[:space:]')" = 16
          grep -i '^content-range: bytes 0-15/380123' "$evidence/range-headers.txt"
          curl -fsS --proto '=https' --max-time 30 --output "$RUNNER_TEMP/tide-public.m4a" "$endpoint"
          cmp "$RUNNER_TEMP/tide-public.m4a" ios/Syllume/Resources/tide.m4a
          shasum -a 256 "$RUNNER_TEMP/tide-public.m4a" | tee "$evidence/sample-sha256.txt"
          simulator_id="$FOLIA_IOS26_SIMULATOR_ID"
          xcrun simctl boot "$simulator_id" || xcrun simctl list devices booted | grep -F "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          export TEST_RUNNER_SYLLUME_TEST_RANGE_AUDIO_URL="$endpoint"
          xcodebuild -project ios/Syllume.xcodeproj -scheme Syllume -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/SyllumeIOS26Build" \
            -resultBundlePath "$RUNNER_TEMP/SyllumePublicNativeHTTPS.xcresult" \
            -only-testing:SyllumeUITests/SyllumeUITests/testNativePublicHTTPSStreamsAndSeeks \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee "$evidence/runner.log"
      - name: Export iOS 26 test evidence
        if: always()
        run: |
          if [ -n "$FOLIA_IOS26_SIMULATOR_ID" ]; then
            mkdir -p "$RUNNER_TEMP/SyllumeIOS26Evidence"
            xcrun simctl spawn "$FOLIA_IOS26_SIMULATOR_ID" log show --last 60m --style compact \
              --predicate 'process == "Syllume" AND eventMessage CONTAINS "[SyllumeStage]"' \
              > "$RUNNER_TEMP/SyllumeIOS26Evidence/Sonnet-stage.log" ||
              echo "::warning::Could not export the simulator stage checkpoints."
            if [ "${{ inputs.youtube_reopen_only || inputs.public_youtube_only || false }}" = "true" ]; then
              xcrun simctl spawn "$FOLIA_IOS26_SIMULATOR_ID" log show --last 35m --style compact \
                --predicate 'process == "Syllume" AND eventMessage CONTAINS "[SyllumeYouTube]"' \
                > "$RUNNER_TEMP/SyllumeIOS26Evidence/YouTube-iOS26.log" ||
                echo "::warning::Could not export the simulator YouTube transport checkpoints."
            fi
            if [ "${{ inputs.http_start_only || false }}" = "true" ]; then
              xcrun simctl spawn "$FOLIA_IOS26_SIMULATOR_ID" log show --last 55m --style compact \
                --predicate 'process == "Syllume" AND eventMessage CONTAINS "Syllume native transport:"' \
                > "$RUNNER_TEMP/SyllumeIOS26Evidence/Native-iOS26.log" ||
                echo "::warning::Could not export the native startup checkpoints."
            fi
          fi
          for name in SyllumeIOS26LargeText SyllumeIOS26Resources SyllumeIOS26Scrub \
            SyllumeIOS26NativeEnd SyllumeIOS26LocalStartup SyllumeIOS26NativeClockStall \
            SyllumeIOS26SonnetRetry SyllumeIOS26SonnetTimeout SyllumeIOS26ColdSonnet SyllumeIOS26RecordedSonnet \
            SyllumeIOS26NavigationRetry SyllumeIOS26NavigationLimit \
            SyllumeIOS26YouTubeReopen \
            SyllumeIOS26HTTP SyllumeIOS26HTTPPaced SyllumeIOS26HTTPStall SyllumeIOS26HTTPSeek SyllumeIOS26HTTPInitialRange \
            SyllumePublicYouTube SyllumePublicNativeHTTPS; do
            result="$RUNNER_TEMP/$name.xcresult"
            if [ -f "$result/Info.plist" ]; then
              evidence="$RUNNER_TEMP/SyllumeIOS26Evidence/$name"
              mkdir -p "$evidence"
              xcrun xcresulttool get test-results summary --path "$result" > "$evidence/test-summary.json"
              xcrun xcresulttool export attachments --path "$result" --output-path "$evidence/attachments"
            fi
            if [ -f "$RUNNER_TEMP/$name/http.jsonl" ]; then
              mkdir -p "$RUNNER_TEMP/SyllumeIOS26Evidence/$name"
              cp "$RUNNER_TEMP/$name/http.jsonl" "$RUNNER_TEMP/SyllumeIOS26Evidence/$name/"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syllume-iOS-26-player
          path: ${{ runner.temp }}/SyllumeIOS26Evidence
          if-no-files-found: ignore
